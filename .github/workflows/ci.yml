name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # 单测需要 Redis（缓存 db2 / 限流 db4 / 隔离 db15）；不需要真实大模型与 Postgres
    # （LLM/MCP 全程 mock；DB 用假会话 / 检查点降级 MemorySaver）。
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        # pyproject 的 build-backend 不可直接 `pip install .`（与 Dockerfile 同因），
        # 故按依赖清单安装：抽出 [project].dependencies + optional.test 再装。
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import tomllib
          d = tomllib.load(open("pyproject.toml", "rb"))
          deps = d["project"]["dependencies"] + d["project"]["optional-dependencies"]["test"]
          open("requirements-ci.txt", "w").write("\n".join(deps))
          PY
          pip install -r requirements-ci.txt
          pip install ruff

      - name: Lint (ruff · pyflakes)
        # 用 GitHub 注解格式输出，失败时错误会出现在 annotations 里（含文件:行号:规则）。
        run: ruff check . --select F --output-format=github

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: ""
          LANGCHAIN_TRACING_V2: "false"
        # 失败时把简短摘要写入 step summary，便于在 Actions 页与 API 直接定位失败用例。
        run: |
          set -o pipefail
          pytest -q --tb=short -ra 2>&1 | tee pytest_out.txt || {
            echo "## pytest 失败摘要" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 pytest_out.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest_out.txt
          if-no-files-found: ignore

      # 评估门禁：编排「计划质量 + RAG 检索 + LLM-as-judge」三层评估。
      # 无 DASHSCOPE_API_KEY 时，LLM 判官自动降级为词面代理且不参与门禁，
      # 仅「计划质量 + RAG recall」这类免配额、结果确定的指标作为红线。
      # 分数低于 eval/thresholds.py 的 GATE 阈值 → --strict 使该步骤退出码 1，阻断合并。
      - name: Eval gate (质量门禁)
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: ""
          LANGCHAIN_TRACING_V2: "false"
        run: python -m eval.run_gate --strict
